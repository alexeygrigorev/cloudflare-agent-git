<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">How the experiment team works</title><desc id="desc">Alexey and the coordinating agent connect to two lead agents, then research teams and worker agents. Evidence returns for independent review and publication. The arrows describe responsibilities, not continuous activity.</desc><defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".5" fill="#1c2027" opacity=".045"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#1c2027" stroke-width="1.6"/></marker></defs><rect width="1100" height="720" fill="#fcfcf8"/><rect width="1100" height="720" fill="url(#grain)"/><g font-family="Arial, sans-serif" fill="#1c2027"><text x="55" y="65" font-size="14" letter-spacing="3">THE OPERATING MODEL</text><text x="55" y="113" font-family="Georgia, serif" font-size="36">Independent work. Shared evidence.</text><g fill="none" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"><path d="M230 235H405"/><path d="M590 245H750"/><path d="M847 290V373"/><path d="M748 438H585"/><path d="M405 438H230"/><path d="M147 390V286"/></g><g><circle cx="147" cy="230" r="46" fill="#2455ed"/><path d="M125 230h44m-22-22v44" stroke="#fcfcf8" stroke-width="2"/><text x="147" y="306" text-anchor="middle" font-size="17">Alexey + coordinator</text><text x="147" y="330" text-anchor="middle" fill="#656a73" font-size="12">Goals, challenges, checks</text></g><g><rect x="412" y="188" width="174" height="101" fill="#2455ed"/><text x="499" y="225" text-anchor="middle" fill="white" font-size="17">Claude · Codex</text><text x="499" y="250" text-anchor="middle" fill="white" font-size="12">Lead agents</text><text x="499" y="322" text-anchor="middle" fill="#656a73" font-size="12">Monitor and challenge</text><text x="499" y="341" text-anchor="middle" fill="#656a73" font-size="12">each other and the teams</text></g><g><path d="M761 190h174v100H761Z" fill="none" stroke="#2455ed" stroke-width="3"/><circle cx="796" cy="220" r="7" fill="#2455ed"/><circle cx="823" cy="220" r="7" fill="#2455ed"/><circle cx="850" cy="220" r="7" fill="#2455ed"/><circle cx="877" cy="220" r="7" fill="#2455ed"/><circle cx="904" cy="220" r="7" fill="#2455ed"/><text x="848" y="263" text-anchor="middle" font-size="17">Research teams</text><text x="848" y="322" text-anchor="middle" fill="#656a73" font-size="12">Own the next useful task</text></g><g><path d="M761 390h174v100H761Z" fill="#2455ed"/><text x="848" y="428" text-anchor="middle" fill="white" font-size="17">Worker agents</text><text x="848" y="455" text-anchor="middle" fill="white" font-size="12">Implement · test · recover</text><text x="848" y="522" text-anchor="middle" fill="#656a73" font-size="12">Headless or interactive</text></g><g><path d="M418 392h160v99H418Z" fill="none" stroke="#1c2027" stroke-width="2"/><path d="M441 417h100m-100 20h72m-72 20h93" stroke="#2455ed" stroke-width="3"/><text x="498" y="522" text-anchor="middle" font-size="17">Evidence + artifacts</text><text x="498" y="545" text-anchor="middle" fill="#656a73" font-size="12">Exact code, checks, failures</text></g><g><circle cx="147" cy="438" r="46" fill="none" stroke="#ef7134" stroke-width="5"/><text x="147" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="22">Review</text><text x="147" y="522" text-anchor="middle" font-size="17">Decide + publish</text><text x="147" y="545" text-anchor="middle" fill="#656a73" font-size="12">Retain corrections and limits</text></g><path d="M55 600H1045" stroke="#dadcd9"/><text x="55" y="638" font-size="13" fill="#656a73">A live process is not a result. A delivered message is not agreement.</text><text x="55" y="663" font-size="13" fill="#656a73">Ordinary Git recovery stays independent of every prototype.</text></g></svg>
