<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="t d">
<title id="t">Tasks closed and still open, by project</title>
<desc id="d">For each project, the bars compare tasks closed in the past day with tasks still open. Agent Branches closed the most and the dashboard the least, and each bar shows its exact number. Nobody knows how many tasks were new.</desc>
<rect width="1100" height="420" fill="#fcfcf8"/>
<g font-family="DejaVu Sans, Verdana, sans-serif">
<text x="40" y="50" font-family="Georgia, serif" font-size="28" fill="#1c2027">Tasks closed and still open</text>
<rect x="40" y="70" width="16" height="16" fill="#2455ed"/><text x="64" y="84" font-size="15" fill="#1c2027">Closed in the past day, at least</text>
<rect x="340" y="70" width="16" height="16" fill="none" stroke="#ef7134" stroke-width="2"/><text x="364" y="84" font-size="15" fill="#1c2027">Still open at the last count</text>
<text x="214" y="146" text-anchor="end" font-size="16" fill="#1c2027">Agent Branches</text>
<rect x="230" y="124" width="641.7" height="20" fill="#2455ed"/><text x="879.7" y="140" font-size="14" fill="#1c2027">11</text>
<rect x="230" y="148" width="525.0" height="20" fill="none" stroke="#ef7134" stroke-width="2"/><text x="763.0" y="164" font-size="14" fill="#1c2027">9</text>
<text x="214" y="208" text-anchor="end" font-size="16" fill="#1c2027">Messaging</text>
<rect x="230" y="186" width="466.7" height="20" fill="#2455ed"/><text x="704.7" y="202" font-size="14" fill="#1c2027">8</text>
<rect x="230" y="210" width="466.7" height="20" fill="none" stroke="#ef7134" stroke-width="2"/><text x="704.7" y="226" font-size="14" fill="#1c2027">8</text>
<text x="214" y="270" text-anchor="end" font-size="16" fill="#1c2027">Launcher</text>
<rect x="230" y="248" width="350.0" height="20" fill="#2455ed"/><text x="588.0" y="264" font-size="14" fill="#1c2027">6</text>
<rect x="230" y="272" width="291.7" height="20" fill="none" stroke="#ef7134" stroke-width="2"/><text x="529.7" y="288" font-size="14" fill="#1c2027">5</text>
<text x="214" y="332" text-anchor="end" font-size="16" fill="#1c2027">Dashboard</text>
<rect x="230" y="310" width="58.3" height="20" fill="#2455ed"/><text x="296.3" y="326" font-size="14" fill="#1c2027">1</text>
<rect x="230" y="334" width="525.0" height="20" fill="none" stroke="#ef7134" stroke-width="2"/><text x="763.0" y="350" font-size="14" fill="#1c2027">9</text>
<text x="40" y="395" font-size="13" fill="#5b6270">New tasks aren’t counted: most tasks in the tracker have no creation date.</text>
</g>
</svg>