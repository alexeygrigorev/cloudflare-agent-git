<svg xmlns="http://www.w3.org/2000/svg" width="600" height="685" viewBox="0 0 600 685" role="img" aria-labelledby="title desc"><title id="title">Storage-aware workspaces hypothesis</title><desc id="desc">Isolated source edits — Writable state per task; Measure full allocation — Dependencies, caches, output; Equivalent task checks — Compare ordinary setup. Proposed workflow, not validation.</desc><defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".5" fill="#1c2027" opacity=".045"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#1c2027" stroke-width="1.6"/></marker></defs><rect width="600" height="685" fill="#fcfcf8"/><rect width="600" height="685" fill="url(#grain)"/><g font-family="Arial, sans-serif" fill="#1c2027"><text x="40" y="53" font-size="20" letter-spacing="2">PROPOSED WORKFLOW</text><path d="M40 80H560" stroke="#dadcd9"/><path d="M40 120V108H108L120 120" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="120" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><rect x="66" y="145" width="28" height="28"/></g><text x="113" y="163" font-size="28">Isolated source edits</text><text x="113" y="199" font-size="28" fill="#656a73">Writable state per task</text><path d="M300 226V254" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 265V253H108L120 265" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="265" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><rect x="66" y="290" width="28" height="28"/></g><text x="113" y="308" font-size="28">Measure full allocation</text><text x="113" y="344" font-size="28" fill="#656a73">Dependencies, caches, output</text><path d="M300 371V399" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 410V398H108L120 410" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="410" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><rect x="66" y="435" width="28" height="28"/></g><text x="113" y="453" font-size="28">Equivalent task checks</text><text x="113" y="489" font-size="28" fill="#656a73">Compare ordinary setup</text><circle cx="75" cy="576" r="23" stroke="#ef7134" stroke-width="4" fill="none"/><text x="75" y="585" font-family="Georgia, serif" font-size="29" text-anchor="middle">?</text><text x="113" y="570" font-size="28">Test mutations and recovery</text><text x="113" y="602" font-size="28" fill="#656a73">Bytes alone do not prove safety.</text></g></svg>