<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="380" viewBox="0 0 1060 380" role="img" aria-labelledby="title desc">
  <title id="title">How the launcher decides</title>
  <desc id="desc">Before each launch the launcher reads fresh quota. A known, healthy reading starts the agent; an unknown or low reading means no launch.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 8 8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1060" height="380" fill="#ffffff"/>

  <path class="edge" d="M300 190L360 190" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M620 190H808Q820 190 820 178V140" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M620 190H808Q820 190 820 202V240" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-blue" transform="translate(40 140)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-issue" x="16" y="30.5" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="54.7" font-size="20">Task waiting</text>
  </g>
  <g class="node node-amber" transform="translate(360 140)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-observability" x="16" y="20" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Read quota</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">Plus memory and disk</text>
  </g>
  <g class="node node-green" transform="translate(760 40)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-robot" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Start the agent</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">Quota known and enough</text>
  </g>
  <g class="node node-gray" transform="translate(760 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-close" x="16" y="20" width="34" height="34" color="#64748b"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Don&#x27;t launch</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">Quota unknown or low</text>
  </g>
</svg>
