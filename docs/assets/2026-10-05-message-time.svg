<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><title id="t">One task, desktop and back</title><desc id="d">A task took about 21 minutes in total. 18 of them were spent waiting for the desktop to check for new messages; the work and the reply took about 3.</desc><rect width="960" height="250" fill="#ffffff"/><g font-family="DejaVu Sans, Verdana, sans-serif"><text x="40" y="56" font-size="22" font-weight="700" fill="#17202c">One task, desktop and back</text><rect x="40" y="74" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="64" y="88" font-size="15" fill="#334155">Waiting for the desktop to check</text><rect x="382" y="74" width="16" height="16" rx="3" fill="#e8f8ef" stroke="#15803d" stroke-width="2"/><text x="406" y="88" font-size="15" fill="#334155">Working and replying</text><text x="40" y="154" font-size="17" fill="#334155">First real task</text><rect x="300" y="130" width="432.0" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="732" y="130" width="72.0" height="36" fill="#e8f8ef" stroke="#15803d" stroke-width="2"/><text x="818" y="155" font-size="18" font-weight="700" fill="#17202c">21 min</text></g></svg>