<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="t d">
<title id="t">Commits per hour, Monday morning to Tuesday morning</title>
<desc id="d">Commits to the experiment repository per hour, from Monday morning to Tuesday morning. Work dropped to one commit an hour after the evening batches and picked up again before midnight. Then nothing was committed for five and a half hours before morning.</desc>
