<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">Tokens in the two recorded sessions</title><desc id="d">Two sessions used about 1.1 million tokens. Most of them were cheap cache reads.</desc><rect width="960" height="330" fill="#ffffff"/><g font-family="DejaVu Sans, Verdana, sans-serif"><text x="40" y="56" font-size="22" font-weight="700" fill="#17202c">Tokens in the two recorded sessions</text><rect x="40" y="74" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="64" y="88" font-size="15" fill="#334155">Cache reads</text><rect x="193" y="74" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="217" y="88" font-size="15" fill="#334155">Everything else</text><text x="40" y="154" font-size="17" fill="#334155">Building the dashboard</text><rect x="300" y="130" width="410.2" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="710.2" y="130" width="66.5" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="791" y="155" font-size="18" font-weight="700" fill="#17202c">0.68M</text><text x="40" y="234" font-size="17" fill="#334155">Reviewing messaging</text><rect x="300" y="210" width="245.7" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="545.7" y="210" width="38.5" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="598" y="235" font-size="18" font-weight="700" fill="#17202c">0.41M</text></g></svg>