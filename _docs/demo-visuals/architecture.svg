<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-labelledby="title desc">
  <title id="title">Git in the cloud, tests on your computer</title>
  <desc id="desc">The authenticated client runs on a user-owned computer. It exchanges Git data and check reports through the Cloudflare Worker, which accesses Artifacts repositories and records state in a SQLite Durable Object.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-registry" viewBox="0 0 24 24">
        <rect x="2.5" y="2.5" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="2.5" y="13" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="13" y="13" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="13.2" y="2" width="8.5" height="8.5" rx="2" transform="rotate(18 17.45 6.25)" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24">
        <rect x="2.5" y="3" width="19" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 7.5h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="5.5" cy="5.25" r=".75" fill="currentColor"/>
        <circle cx="8" cy="5.25" r=".75" fill="currentColor"/>
        <path d="m7 12 3 2.5-3 2.5M12.5 17h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="560" fill="#fcfcf8"/>

  <g class="node-boundary node-gray" transform="translate(20 150)">
    <rect width="280" height="260" rx="22" fill="none" stroke="#1c2027"/>
    <text class="boundary-title" x="20" y="31">User-owned computer</text>
  </g>
  <g class="node-boundary node-gray" transform="translate(320 20)">
    <rect width="600" height="520" rx="22" fill="none" stroke="#1c2027"/>
    <text class="boundary-title" x="20" y="31">Cloudflare</text>
  </g>
  <path class="edge-boundary-halo" d="M280 280L350 280" fill="none" stroke="#fcfcf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M280 280L350 280" stroke="#1c2027" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M590 263.33H625V145H660" stroke="#1c2027" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M590 296.67H625V415H660" stroke="#1c2027" marker-end="url(#arrow-gray)"/>

  <g class="node node-gray" transform="translate(40 230)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <use href="#icon-terminal" x="16.65" y="20" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="59.11" y="42.04" font-size="14">Authenticated client</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">Runs merge and tests</text>
  </g>
  <g class="node node-gray" transform="translate(350 230)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <use href="#icon-api" x="32.14" y="20" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="75.32" y="42.04" font-size="14">Worker gateway</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">Git and check reports</text>
  </g>
  <g class="node node-gray" transform="translate(660 95)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <use href="#icon-database" x="63.27" y="20" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="105.02" y="42.04" font-size="14">Artifacts</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">Canonical repo and forks</text>
  </g>
  <g class="node node-gray" transform="translate(660 365)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <use href="#icon-registry" x="50.1" y="20" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="93.28" y="42.04" font-size="14">Coordinator</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">SQLite Durable Object</text>
  </g>
</svg>
