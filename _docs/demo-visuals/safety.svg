<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
  <title id="title">Four reasons a pair isn&#x27;t safe</title>
  <desc id="desc">Compare a Git conflict with failing combined tests despite passing individual tests. A missing push leaves the current head unknown, while checks on older heads don&#x27;t prove the current changes safe. These conceptual examples explain the fixture screens.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>

    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="460" fill="#fcfcf8"/>


  <g class="node-specimen node-gray specimen-record" transform="translate(40 40)" filter="url(#shadow)">
    <rect width="400" height="160" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text x="24" y="31" font-size="19" font-weight="750" text-anchor="start" fill="#1c2027">Text conflict</text>
    <rect x="20" y="46" width="360" height="84" rx="10" fill="#fcfcf8" stroke="#1c2027"/>
    <circle cx="34" cy="65" r="3" fill="#1c2027"/>
    <text x="46" y="70" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Change A: same lines</text>
    <circle cx="34" cy="90" r="3" fill="#1c2027"/>
    <text x="46" y="95" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Change B: same lines</text>
    <circle cx="34" cy="115" r="3" fill="#1c2027"/>
    <text x="46" y="120" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Trial merge: conflict</text>
  </g>
  <g class="node-specimen node-gray specimen-record" transform="translate(500 40)" filter="url(#shadow)">
    <rect width="400" height="160" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text x="24" y="31" font-size="19" font-weight="750" text-anchor="start" fill="#1c2027">Combined failure</text>
    <rect x="20" y="46" width="360" height="84" rx="10" fill="#fcfcf8" stroke="#1c2027"/>
    <circle cx="34" cy="65" r="3" fill="#1c2027"/>
    <text x="46" y="70" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Agent A tests: pass</text>
    <circle cx="34" cy="90" r="3" fill="#1c2027"/>
    <text x="46" y="95" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Agent B tests: pass</text>
    <circle cx="34" cy="115" r="3" fill="#1c2027"/>
    <text x="46" y="120" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Combined tests: fail</text>
  </g>
  <g class="node-specimen node-gray specimen-record" transform="translate(40 260)" filter="url(#shadow)">
    <rect width="400" height="160" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text x="24" y="31" font-size="19" font-weight="750" text-anchor="start" fill="#1c2027">Missing push</text>
    <rect x="20" y="46" width="360" height="84" rx="10" fill="#fcfcf8" stroke="#1c2027"/>
    <circle cx="34" cy="65" r="3" fill="#1c2027"/>
    <text x="46" y="70" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Latest push: missing</text>
    <circle cx="34" cy="90" r="3" fill="#1c2027"/>
    <text x="46" y="95" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Current head: unknown</text>
    <circle cx="34" cy="115" r="3" fill="#1c2027"/>
    <text x="46" y="120" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Verdict: not safe</text>
  </g>
  <g class="node-specimen node-gray specimen-record" transform="translate(500 260)" filter="url(#shadow)">
    <rect width="400" height="160" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text x="24" y="31" font-size="19" font-weight="750" text-anchor="start" fill="#1c2027">Stale evidence</text>
    <rect x="20" y="46" width="360" height="84" rx="10" fill="#fcfcf8" stroke="#1c2027"/>
    <circle cx="34" cy="65" r="3" fill="#1c2027"/>
    <text x="46" y="70" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Tested head: older</text>
    <circle cx="34" cy="90" r="3" fill="#1c2027"/>
    <text x="46" y="95" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Current head: newer</text>
    <circle cx="34" cy="115" r="3" fill="#1c2027"/>
    <text x="46" y="120" font-size="14" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" fill="#1c2027">Verdict: not proven safe</text>
  </g>
</svg>
