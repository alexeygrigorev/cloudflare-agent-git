<svg xmlns="http://www.w3.org/2000/svg" width="600" height="975" viewBox="0 0 600 975" role="img" aria-labelledby="title desc"><title id="title">How the agent team works</title><desc id="desc">Alexey + coordinating agent — Goals, challenges, checks; Claude + Codex lead agents — Monitor teams and each other; Five research teams — Pick useful next tasks; Worker agents — Implement, test, recover; Evidence + independent review — Decide, correct, publish. A proposed way of working, not proof that it works.</desc><defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".5" fill="#1c2027" opacity=".045"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#1c2027" stroke-width="1.6"/></marker></defs><rect width="600" height="975" fill="#fcfcf8"/><rect width="600" height="975" fill="url(#grain)"/><g font-family="Arial, sans-serif" fill="#1c2027"><text x="40" y="53" font-size="24" letter-spacing="2">HOW THE TEAM WORKS</text><path d="M40 80H560" stroke="#dadcd9"/><path d="M40 120V108H108L120 120" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="120" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><circle cx="80" cy="159" r="15"/></g><text x="113" y="163" font-size="28">Alexey + coordinating agent</text><text x="113" y="199" font-size="28" fill="#656a73">Goals, challenges, checks</text><path d="M300 226V254" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 265V253H108L120 265" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="265" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><circle cx="80" cy="304" r="15"/></g><text x="113" y="308" font-size="28">Claude + Codex lead agents</text><text x="113" y="344" font-size="28" fill="#656a73">Monitor teams and each other</text><path d="M300 371V399" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 410V398H108L120 410" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="410" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><circle cx="80" cy="449" r="15"/></g><text x="113" y="453" font-size="28">Five research teams</text><text x="113" y="489" font-size="28" fill="#656a73">Pick useful next tasks</text><path d="M300 516V544" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 555V543H108L120 555" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="555" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><circle cx="80" cy="594" r="15"/></g><text x="113" y="598" font-size="28">Worker agents</text><text x="113" y="634" font-size="28" fill="#656a73">Implement, test, recover</text><path d="M300 661V689" stroke="#1c2027" stroke-width="2" marker-end="url(#arrow)"/><path d="M40 700V688H108L120 700" fill="#fcfcf8" stroke="#1c2027" stroke-width="2"/><rect x="40" y="700" width="520" height="106" fill="none" stroke="#1c2027" stroke-width="2"/><g fill="#2455ed"><circle cx="80" cy="739" r="15"/></g><text x="113" y="743" font-size="28">Evidence + independent review</text><text x="113" y="779" font-size="28" fill="#656a73">Decide, correct, publish</text><circle cx="75" cy="866" r="23" stroke="#ef7134" stroke-width="4" fill="none"/><text x="75" y="875" font-family="Georgia, serif" font-size="29" text-anchor="middle">?</text><text x="113" y="860" font-size="28">Responsibilities, not activity</text><text x="113" y="892" font-size="28" fill="#656a73">Ordinary Git stays independent.</text></g></svg>