<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="400" viewBox="0 0 1020 400" role="img" aria-labelledby="title desc">
  <title id="title">Failed pushes: before and now</title>
  <desc id="desc">A push that timed out used to be sent again and could land twice. Now the tool stops and reports what went through.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 8 8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2.5 20 6v5.5c0 5-3.1 8.6-8 10-4.9-1.4-8-5-8-10V6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1020" height="400" fill="#ffffff"/>

  <line class="divider" x1="16" y1="200" x2="1004" y2="200"/>

  <path class="edge" d="M300 110L380 110" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M640 110L720 110" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M300 290L380 290" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M640 290L720 290" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <g class="node node-amber" transform="translate(40 60)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <text class="eyebrow" x="130" y="30.5" font-size="13">BEFORE</text>
    <use href="#icon-warning" x="16" y="40.5" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="64.7" font-size="20">Push times out</text>
  </g>
  <g class="node node-gray" transform="translate(380 60)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-workflow" x="16" y="30.5" width="34" height="34" color="#64748b"/>
    <text class="node-title icon-copy" x="62" y="54.7" font-size="20">Send it again</text>
  </g>
  <g class="node node-red" transform="translate(720 60)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-close" x="16" y="30.5" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="62" y="54.7" font-size="20">Written twice</text>
  </g>
  <g class="node node-amber" transform="translate(40 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <text class="eyebrow" x="130" y="30.5" font-size="13">NOW</text>
    <use href="#icon-warning" x="16" y="40.5" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="64.7" font-size="20">Push times out</text>
  </g>
  <g class="node node-purple" transform="translate(380 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-shield" x="16" y="30.5" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="54.7" font-size="20">Stop</text>
  </g>
  <g class="node node-green" transform="translate(720 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-check" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Report</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">Sent, not sent, unclear</text>
  </g>
</svg>
