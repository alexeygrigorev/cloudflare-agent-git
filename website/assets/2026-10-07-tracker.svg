<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">The tasks&#x27; new home</title>
  <desc id="desc">The agents moved every task out of one big data file and into public GitHub issues. Each product team owns its own tracker, and the main repository holds my requests and the high-level tasks.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="650" fill="#fcfcf8"/>

  <path class="edge" d="M340 322H450V90H560" stroke="#1c2027" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M340 322H450V206H560" stroke="#1c2027" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M340 322L560 322" stroke="#1c2027" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M340 322H450V438H560" stroke="#1c2027" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M340 322H450V554H560" stroke="#1c2027" marker-end="url(#arrow-gray)"/>

  <g class="node node-gray" transform="translate(40 272)" filter="url(#shadow)">
    <rect width="300" height="100" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="150" y="20" font-size="13">BEFORE</text>
    <use href="#icon-document" x="16" y="30" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="54.2" font-size="20">One task file</text>
    <text class="node-subtitle" x="150" y="85" font-size="16">One big data file</text>
  </g>
  <g class="node node-blue" transform="translate(560 40)" filter="url(#shadow)">
    <rect width="300" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <text class="eyebrow" x="150" y="20" font-size="13">MAIN REPOSITORY</text>
    <use href="#icon-user" x="16" y="30" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="54.2" font-size="20">My requests</text>
    <text class="node-subtitle" x="150" y="85" font-size="16">And the high-level tasks</text>
  </g>
  <g class="node node-purple" transform="translate(560 156)" filter="url(#shadow)">
    <rect width="300" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-issue" x="16" y="20" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Agent Branches</text>
    <text class="node-subtitle" x="150" y="75" font-size="16">Its team&#x27;s issues</text>
  </g>
  <g class="node node-purple" transform="translate(560 272)" filter="url(#shadow)">
    <rect width="300" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-issue" x="16" y="20" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Dashboard</text>
    <text class="node-subtitle" x="150" y="75" font-size="16">Its team&#x27;s issues</text>
  </g>
  <g class="node node-purple" transform="translate(560 388)" filter="url(#shadow)">
    <rect width="300" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-issue" x="16" y="20" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Launcher</text>
    <text class="node-subtitle" x="150" y="75" font-size="16">Its team&#x27;s issues</text>
  </g>
  <g class="node node-purple" transform="translate(560 504)" filter="url(#shadow)">
    <rect width="300" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-issue" x="16" y="20" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Messaging</text>
    <text class="node-subtitle" x="150" y="75" font-size="16">Its issues, in two trackers</text>
  </g>
</svg>
