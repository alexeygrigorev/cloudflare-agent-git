<text x="560" y="150" text-anchor="end" font-size="26" fill="#4a505a">Open now</text>
<text x="40" y="190" font-size="28" fill="#1c2027">Main repository</text><text x="560" y="190" text-anchor="end" font-size="28" fill="#1c2027">49</text>
