<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" role="img" aria-labelledby="title desc">
  <title id="title">My open requests and their state</title>
  <desc id="desc">Eight requests and their state. Public issues and tidy documentation are done. The task counter is code only, and lost agents come back only by hand. The agent that should fix the rest has instructions and a planned test. Work without me and two computers talking are still open, and the process article waits for my review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 8 8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-environment" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="3" y="13" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7 7h7M7 17h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="17" cy="7" r="1" fill="currentColor"/><circle cx="17" cy="17" r="1" fill="currentColor"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2.5 20 6v5.5c0 5-3.1 8.6-8 10-4.9-1.4-8-5-8-10V6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="760" height="670" fill="#fcfcf8"/>


  <g class="node node-green" transform="translate(40 50)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="30" font-size="13">DONE</text>
    <use href="#icon-check" x="16" y="40" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Requests in public issues</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">Each product has a tracker</text>
  </g>
  <g class="node node-green" transform="translate(400 50)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="30" font-size="13">DONE</text>
    <use href="#icon-check" x="16" y="40" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Tidy documentation</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">My messages in one journal</text>
  </g>
  <g class="node node-amber" transform="translate(40 200)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#ef7134"/>
    <text class="eyebrow" x="160" y="30" font-size="13">CODE ONLY</text>
    <use href="#icon-observability" x="16" y="40" width="34" height="34" color="#ef7134"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Count resolved tasks</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">Not on the dashboard yet</text>
  </g>
  <g class="node node-amber" transform="translate(400 200)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#ef7134"/>
    <text class="eyebrow" x="160" y="30" font-size="13">BY HAND ONLY</text>
    <use href="#icon-warning" x="16" y="40" width="34" height="34" color="#ef7134"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Restore lost agents</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">No script does it yet</text>
  </g>
  <g class="node node-amber" transform="translate(40 350)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#ef7134"/>
    <text class="eyebrow" x="160" y="30" font-size="13">TEST PLANNED</text>
    <use href="#icon-shield" x="16" y="40" width="34" height="34" color="#ef7134"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">An agent that fixes the rest</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">Instructions written</text>
  </g>
  <g class="node node-gray" transform="translate(400 350)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="30" font-size="13">WAITS FOR ME</text>
    <use href="#icon-document" x="16" y="40" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Article on the process</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">After I review the plan</text>
  </g>
  <g class="node node-gray" transform="translate(40 500)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="30" font-size="13">OPEN</text>
    <use href="#icon-close" x="16" y="40" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Work goes on without me</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">Replies don&#x27;t wake agents</text>
  </g>
  <g class="node node-gray" transform="translate(400 500)" filter="url(#shadow)">
    <rect width="320" height="120" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="30" font-size="13">NOT RUN</text>
    <use href="#icon-environment" x="16" y="40" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="62.4" font-size="15">Two computers talking</text>
    <text class="node-subtitle" x="160" y="95" font-size="16">Tested on one computer</text>
  </g>
</svg>
