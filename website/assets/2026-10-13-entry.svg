<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">The contest entry on a fresh copy</title>
  <desc id="desc">On a fresh copy from GitHub, install, build and the walkthrough worked, and all 238 tests passed. Live Cloudflare, two computers, a bill cap and the contest form are still on hold.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 8 8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2.5 20 6v5.5c0 5-3.1 8.6-8 10-4.9-1.4-8-5-8-10V6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24">
        <rect x="2.5" y="3" width="19" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 7.5h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="5.5" cy="5.25" r=".75" fill="currentColor"/>
        <circle cx="8" cy="5.25" r=".75" fill="currentColor"/>
        <path d="m7 12 3 2.5-3 2.5M12.5 17h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="760" height="640" fill="#fcfcf8"/>


  <g class="node node-green" transform="translate(40 55)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">CHECKED</text>
    <use href="#icon-terminal" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Install and build</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Only the README steps</text>
  </g>
  <g class="node node-green" transform="translate(40 195)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">CHECKED</text>
    <use href="#icon-workflow" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Walkthrough</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Scripted local clients</text>
  </g>
  <g class="node node-green" transform="translate(40 335)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">CHECKED</text>
    <use href="#icon-check" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">238 tests</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">All passed</text>
  </g>
  <g class="node node-green" transform="translate(40 475)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ADDED</text>
    <use href="#icon-shield" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Storage call limits</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">200 a day, 6,000 a month</text>
  </g>
  <g class="node node-gray" transform="translate(400 55)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ON HOLD</text>
    <use href="#icon-close" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Live Cloudflare</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Not deployed</text>
  </g>
  <g class="node node-gray" transform="translate(400 195)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ON HOLD</text>
    <use href="#icon-close" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Two computers</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Not run</text>
  </g>
  <g class="node node-gray" transform="translate(400 335)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ON HOLD</text>
    <use href="#icon-user" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Contest form</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Mine to submit</text>
  </g>
  <g class="node node-gray" transform="translate(400 475)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ON HOLD</text>
    <use href="#icon-close" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Bill cap</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Limits count calls only</text>
  </g>
</svg>
