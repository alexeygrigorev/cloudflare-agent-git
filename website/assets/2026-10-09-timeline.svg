<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400" role="img" aria-labelledby="t d">
<title id="t">Minutes after the third kill</title>
<desc id="d">The replacement held its role within two minutes, gave a useful answer at three and renewed its role at four. Its first regular check was due at 31 minutes, nothing had been installed to run it, and the role expired at 35 minutes.</desc>
<rect width="1060" height="400" fill="#fcfcf8"/>
<g font-family="DejaVu Sans, Verdana, sans-serif">
<text x="40" y="54" font-family="Georgia, serif" font-size="28" fill="#1c2027">Minutes after the third kill</text>
<line x1="60" y1="270" x2="1000" y2="270" stroke="#1c2027" stroke-width="2"/>
<line x1="60.0" y1="270" x2="60.0" y2="278" stroke="#1c2027" stroke-width="2"/>
<text x="60.0" y="300" text-anchor="middle" font-size="15" fill="#5b6270">0 min</text>
<line x1="295.0" y1="270" x2="295.0" y2="278" stroke="#1c2027" stroke-width="2"/>
<text x="295.0" y="300" text-anchor="middle" font-size="15" fill="#5b6270">10 min</text>
<line x1="530.0" y1="270" x2="530.0" y2="278" stroke="#1c2027" stroke-width="2"/>
<text x="530.0" y="300" text-anchor="middle" font-size="15" fill="#5b6270">20 min</text>
<line x1="765.0" y1="270" x2="765.0" y2="278" stroke="#1c2027" stroke-width="2"/>
<text x="765.0" y="300" text-anchor="middle" font-size="15" fill="#5b6270">30 min</text>
<line x1="1000.0" y1="270" x2="1000.0" y2="278" stroke="#1c2027" stroke-width="2"/>
<text x="1000.0" y="300" text-anchor="middle" font-size="15" fill="#5b6270">40 min</text>
<line x1="107.0" y1="119" x2="107.0" y2="270" stroke="#2455ed" stroke-width="2"/>
<line x1="107.0" y1="119" x2="186.0" y2="119" stroke="#2455ed" stroke-width="2"/>
<rect x="100.0" y="263" width="14" height="14" fill="#2455ed"/>
<text x="194.0" y="124" text-anchor="start" font-size="17" fill="#1c2027">Holds the role · 2 min</text>
<line x1="130.5" y1="159" x2="130.5" y2="270" stroke="#2455ed" stroke-width="2"/>
<line x1="130.5" y1="159" x2="186.0" y2="159" stroke="#2455ed" stroke-width="2"/>
<rect x="123.5" y="263" width="14" height="14" fill="#2455ed"/>
<text x="194.0" y="164" text-anchor="start" font-size="17" fill="#1c2027">Useful answer · 3 min</text>
<line x1="154.0" y1="199" x2="154.0" y2="270" stroke="#2455ed" stroke-width="2"/>
<line x1="154.0" y1="199" x2="186.0" y2="199" stroke="#2455ed" stroke-width="2"/>
<rect x="147.0" y="263" width="14" height="14" fill="#2455ed"/>
<text x="194.0" y="204" text-anchor="start" font-size="17" fill="#1c2027">Renews the role · 4 min</text>
<line x1="788.5" y1="168" x2="788.5" y2="270" stroke="#5b6270" stroke-width="2"/>
<circle cx="788.5" cy="270" r="8" fill="#fcfcf8" stroke="#5b6270" stroke-width="2"/>
<text x="778.5" y="164" text-anchor="end" font-size="17" fill="#1c2027">First check due, none ran · 31 min</text>
<line x1="882.5" y1="128" x2="882.5" y2="270" stroke="#ef7134" stroke-width="2"/>
<circle cx="882.5" cy="270" r="10" fill="#ef7134"/>
<text x="872.5" y="124" text-anchor="end" font-size="17" fill="#1c2027">Role expires · 35 min</text>
<text x="40" y="370" font-size="15" fill="#5b6270">The agent stayed alive the whole time. Only its role ran out.</text>
</g>
</svg>
