<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">My requests and their state</title>
  <desc id="desc">The contest entry is in progress and the other products are paused, with one root in place. The older commits went to GitHub and the thread limit went up. Two computers talking, automatic recovery of a lost agent and daily reports on schedule are still open.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 8 8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2.5 20 6v5.5c0 5-3.1 8.6-8 10-4.9-1.4-8-5-8-10V6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="760" height="700" fill="#fcfcf8"/>


  <g class="node node-amber" transform="translate(40 85)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#ef7134"/>
    <text class="eyebrow" x="160" y="25" font-size="13">IN PROGRESS</text>
    <use href="#icon-workflow" x="16" y="35" width="34" height="34" color="#ef7134"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">Contest entry by Oct 14</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Final run review open</text>
  </g>
  <g class="node node-green" transform="translate(400 85)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">DONE</text>
    <use href="#icon-robot" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">One root only</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Desktop root stood down</text>
  </g>
  <g class="node node-green" transform="translate(40 225)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">DONE</text>
    <use href="#icon-github" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">35 older commits</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Sent, not re-reviewed</text>
  </g>
  <g class="node node-green" transform="translate(400 225)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">DONE</text>
    <use href="#icon-settings" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">Thread limit</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Raised from 100 to 256</text>
  </g>
  <g class="node node-gray" transform="translate(40 365)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">PAUSED</text>
    <use href="#icon-close" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">Other products</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Until the deadline</text>
  </g>
  <g class="node node-gray" transform="translate(400 365)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">HELD</text>
    <use href="#icon-shield" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">Cloudflare and spending</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Only on the root&#x27;s message</text>
  </g>
  <g class="node node-gray" transform="translate(40 505)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">OPEN</text>
    <use href="#icon-message" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">Two computers talking</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Desktop offline</text>
  </g>
  <g class="node node-gray" transform="translate(400 505)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">OPEN</text>
    <use href="#icon-issue" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="58.12" font-size="17">Recovery and reports</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Lost agent, daily schedule</text>
  </g>
</svg>
