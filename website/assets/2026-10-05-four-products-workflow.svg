<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc">
  <title id="title">Four product teams and current delivery status</title>
  <desc id="desc">Agent Branches audits fail-closed push, Agent Bus verifies local RPC dogfood, and Dashboard and Launcher integrations remain held under monitor oversight.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="490" fill="#fcfcf8"/>

  <path class="edge" d="M350 90H315V240H280" stroke="#2455ed" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M590 90H625V240H660" stroke="#ef7134" marker-end="url(#arrow-amber)"/>
  <path class="edge" d="M160 290V320H160V350" stroke="#2455ed" marker-end="url(#arrow-purple)"/>
  <g class="edge-label" transform="translate(160 320)">
    <rect x="-59.53" y="-16" width="119.07" height="32" rx="16.0" fill="#fcfcf8" stroke="#2455ed"/>
    <text fill="#2455ed">Review task</text>
  </g>
  <path class="edge" d="M780 290V320H780V350" stroke="#1c2027" stroke-dasharray="8 8" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M280 400L470 400L470 140" stroke="#2455ed" stroke-dasharray="8 8" marker-end="url(#arrow-purple)"/>
  <g class="edge-label" transform="translate(470 400)">
    <rect x="-50.22" y="-16" width="100.43" height="32" rx="16.0" fill="#fcfcf8" stroke="#2455ed"/>
    <text fill="#2455ed">RPC reply</text>
  </g>

  <g class="node node-blue" transform="translate(350 40)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-robot" x="16" y="9" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="31.76" font-size="16">Codex principal</text>
    <text class="node-subtitle" x="120" y="64" font-size="16">Tracks tasks and</text>
    <text class="node-subtitle" x="120" y="86" font-size="16">evidence</text>
  </g>
  <g class="node node-blue" transform="translate(40 190)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-workflow" x="16" y="20" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="42.76" font-size="16">Agent Branches</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">SDK push fails closed</text>
  </g>
  <g class="node node-purple" transform="translate(40 350)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-message" x="16" y="9" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="31.76" font-size="16">Agent Bus</text>
    <text class="node-subtitle" x="120" y="64" font-size="16">Local RPC dogfood</text>
    <text class="node-subtitle" x="120" y="86" font-size="16">verified</text>
  </g>
  <g class="node node-amber" transform="translate(660 190)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#ef7134"/>
    <use href="#icon-settings" x="16" y="9" width="34" height="34" color="#ef7134"/>
    <text class="node-title icon-copy" x="62" y="31.76" font-size="16">Quota Launcher</text>
    <text class="node-subtitle" x="120" y="64" font-size="16">Autonomous runtime</text>
    <text class="node-subtitle" x="120" y="86" font-size="16">held</text>
  </g>
  <g class="node node-gray" transform="translate(660 350)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <use href="#icon-observability" x="16" y="9" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="31.76" font-size="16">Agent Dashboard</text>
    <text class="node-subtitle" x="120" y="64" font-size="16">Canonical integration</text>
    <text class="node-subtitle" x="120" y="86" font-size="16">held</text>
  </g>
</svg>
