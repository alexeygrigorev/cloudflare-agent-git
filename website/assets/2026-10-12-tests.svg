<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
<title id="t">Test runs in the three-agent rehearsal</title>
<desc id="d">The first check ran 321 tests across the three pairs of agents, and 2 failed. After agent B fixed its code, all 323 passed. Counts are test runs, not unique tests.</desc>
<rect width="900" height="330" fill="#fcfcf8"/>
<g font-family="DejaVu Sans, Verdana, sans-serif">
<text x="40" y="50" font-family="Georgia, serif" font-size="28" fill="#1c2027">Test runs in the three-agent rehearsal</text>
<rect x="40" y="70" width="16" height="16" fill="#2455ed"/><text x="64" y="84" font-size="15" fill="#1c2027">Passed</text>
<rect x="160" y="70" width="16" height="16" fill="#ef7134"/><text x="184" y="84" font-size="15" fill="#1c2027">Failed</text>
<text x="214" y="146" text-anchor="end" font-size="16" fill="#1c2027">First check</text>
<rect x="230" y="120" width="446.6" height="40" fill="#2455ed"/>
<rect x="676.6" y="120" width="8.8" height="40" fill="#ef7134"/>
<text x="695.4" y="146" font-size="15" fill="#1c2027">319 passed, 2 failed</text>
<text x="214" y="216" text-anchor="end" font-size="16" fill="#1c2027">After agent B's fix</text>
<rect x="230" y="190" width="452.2" height="40" fill="#2455ed"/>
<text x="698.2" y="216" font-size="15" fill="#1c2027">323 passed</text>
<text x="40" y="304" font-size="15" fill="#4a505a">Test runs across the three pairs of agents, not unique tests.</text>
</g>
</svg>
