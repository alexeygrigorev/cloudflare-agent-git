<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">One product until the deadline</title>
  <desc id="desc">Agent Branches is the only active product until the deadline. The dashboard, the launcher and the messaging work are paused. The Grok chat bot is the only root, and the Windows desktop is an offline work machine.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-environment" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="3" y="13" width="18" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7 7h7M7 17h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="17" cy="7" r="1" fill="currentColor"/><circle cx="17" cy="17" r="1" fill="currentColor"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-pull-request" viewBox="0 0 24 24">
        <circle cx="6" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 7.5v9M15 5h1a2 2 0 0 1 2 2v9.5M13 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-queue" viewBox="0 0 56 28">
        <path d="M5 8h46M5 20h46" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M5 8C.3 8 .3 20 5 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="51" cy="14" rx="3.5" ry="6" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="760" height="560" fill="#fcfcf8"/>


  <g class="node node-green" transform="translate(40 85)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ACTIVE</text>
    <use href="#icon-pull-request" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Agent Branches</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Contest entry, due Oct 14</text>
  </g>
  <g class="node node-purple" transform="translate(400 85)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <text class="eyebrow" x="160" y="25" font-size="13">ONLY ROOT</text>
    <use href="#icon-robot" x="16" y="35" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Grok chat bot</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Checks and talks to me</text>
  </g>
  <g class="node node-gray" transform="translate(40 225)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">PAUSED</text>
    <use href="#icon-observability" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Dashboard</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Until the deadline</text>
  </g>
  <g class="node node-gray" transform="translate(400 225)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">OFFLINE</text>
    <use href="#icon-environment" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Windows desktop</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Work machine, no root</text>
  </g>
  <g class="node node-gray" transform="translate(40 365)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">PAUSED</text>
    <use href="#icon-queue" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Launcher</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Repairs for the entry only</text>
  </g>
  <g class="node node-gray" transform="translate(400 365)" filter="url(#shadow)">
    <rect width="320" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <text class="eyebrow" x="160" y="25" font-size="13">PAUSED</text>
    <use href="#icon-message" x="16" y="35" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="59.2" font-size="20">Messaging</text>
    <text class="node-subtitle" x="160" y="90" font-size="16">Repairs for the entry only</text>
  </g>
</svg>
