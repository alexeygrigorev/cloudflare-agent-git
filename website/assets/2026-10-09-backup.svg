<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc">
  <title id="title">The path of a code backup</title>
  <desc id="desc">The agents sent the reviewed recovery code to GitHub through Agent Branches. A reviewer on a different model checked it for private data first, and another agent restored it from a fresh copy and checked the code. The running system isn&#x27;t backed up this way.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2027" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2455ed"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef7134"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1c2027"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2.5 20 6v5.5c0 5-3.1 8.6-8 10-4.9-1.4-8-5-8-10V6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1c2027; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #1c2027; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #1c2027; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #1c2027; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #fcfcf8; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #1c2027; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #1c2027; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1060" height="280" fill="#fcfcf8"/>

  <path class="edge" d="M320 140L390 140" stroke="#1c2027" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M670 140L740 140" stroke="#1c2027" marker-end="url(#arrow-green)"/>

  <g class="node node-amber" transform="translate(40 85)" filter="url(#shadow)">
    <rect width="280" height="110" rx="18" fill="#fcfcf8" stroke="#ef7134"/>
    <use href="#icon-shield" x="16" y="25" width="34" height="34" color="#ef7134"/>
    <text class="node-title icon-copy" x="62" y="48.12" font-size="17">Privacy review</text>
    <text class="node-subtitle" x="140" y="80" font-size="16">By a different model</text>
  </g>
  <g class="node node-purple" transform="translate(390 85)" filter="url(#shadow)">
    <rect width="280" height="110" rx="18" fill="#fcfcf8" stroke="#2455ed"/>
    <use href="#icon-github" x="16" y="25" width="34" height="34" color="#2455ed"/>
    <text class="node-title icon-copy" x="62" y="48.12" font-size="17">Agent Branches</text>
    <text class="node-subtitle" x="140" y="80" font-size="16">Sends it to GitHub</text>
  </g>
  <g class="node node-green" transform="translate(740 85)" filter="url(#shadow)">
    <rect width="280" height="110" rx="18" fill="#fcfcf8" stroke="#1c2027"/>
    <use href="#icon-check" x="16" y="25" width="34" height="34" color="#1c2027"/>
    <text class="node-title icon-copy" x="62" y="48.12" font-size="17">Fresh copy restored</text>
    <text class="node-subtitle" x="140" y="80" font-size="16">Code checks out</text>
  </g>
</svg>
