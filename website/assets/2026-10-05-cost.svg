<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">Monthly Cloudflare cost</title>
<desc id="d">My budget is 5 dollars a month. Two message relays that never sleep would bring the bill to about 17.50 dollars.</desc>
<rect width="960" height="300" fill="#ffffff"/>
<g font-family="DejaVu Sans, Verdana, sans-serif">
<text x="40" y="56" font-size="22" font-weight="700" fill="#17202c">Monthly Cloudflare cost</text>
<text x="40" y="118" font-size="17" fill="#334155">My budget</text>
<rect x="320" y="94" width="137" height="36" rx="6" fill="#e8f8ef" stroke="#15803d" stroke-width="2"/>
<text x="471" y="119" font-size="18" font-weight="700" fill="#15803d">$5</text>
<text x="40" y="196" font-size="17" fill="#334155">Two relays that</text>
<text x="40" y="218" font-size="17" fill="#334155">never sleep</text>
<rect x="320" y="184" width="480" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="814" y="209" font-size="18" font-weight="700" fill="#dc2626">$17.50</text>
<line x1="457" y1="80" x2="457" y2="250" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5"/>
<text x="465" y="266" font-size="14" fill="#15803d">budget line</text>
</g>
</svg>
